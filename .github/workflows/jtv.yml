name: Update JTV PLUS 3 Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'script/jtvplus3.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: update-jtv2
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"

      - name: Fetch and Reset to Remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Script
        run: |
          python script/jtvplus3.py

      - name: Debug Output Files
        run: |
          echo "Checking for output files..."
          ls -la jtv2.json jtvplus3.m3u || echo "One or more files missing!"

      - name: Commit and Push Changes
        run: |
          git add -f jtv2.json jtvplus3.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update playlist ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          git fetch origin main
          git rebase origin/main

          git push origin main
