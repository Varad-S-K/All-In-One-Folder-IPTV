name: LIVE Event Playlist

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'script/live.py'

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ← ADDED

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run live.py
        run: python script/live.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"

          git add LiveEvent.m3u

          if git diff --cached --quiet; then    # ← ADDED: skip if no changes
            echo "No changes to commit. Skipping push."
            exit 0
          fi

          git commit -m "Auto-update playlists: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && echo "Push succeeded." && exit 0
            echo "Push failed, retrying attempt $i of 5..."
            sleep $((RANDOM % 10 + 1))
          done

          echo "All push attempts failed." && exit 1   # ← ADDED: fail loudly
